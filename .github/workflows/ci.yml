name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node --check site.js
      - run: npx --yes html-validate@11.16.4 index.html obsidian.html

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          # linkedin answers 999 to bots; fonts hosts are preconnect-only
          args: --no-progress --exclude linkedin.com --exclude fonts.g '*.html' '*.md'
          fail: true
